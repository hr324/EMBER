[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-forensics"
version = "0.1.0"
description = "Reproducible, physics-informed historical wildfire origin reconstruction"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.26"]
notebooks = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "nbformat>=5.9", "ipykernel>=6"]
geo = ["shapely>=2.0", "pyproj>=3.5", "rasterio>=1.3"]
test = ["pytest>=8"]

[project.scripts]
fireforensics = "wildfire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
